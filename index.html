<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live AI Classroom Platform</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    globalThis.tailwind = globalThis.tailwind || {};
    globalThis.tailwind.config = {
      darkMode: false,
      theme: {
        extend: {
          colors: {
            /* iOS Light Blue Glass Palette */
            'neon-purple':      '#4A90E2',   /* primary blue */
            'electric-violet':  '#64B5F6',   /* accent blue */
            'cyber-lavender':   '#64748B',   /* secondary text */
            'deep-violet':      '#2563EB',   /* deeper blue */
            'glow-purple':      'rgba(74, 144, 226, 0.25)',
            'glass-border':     'rgba(255, 255, 255, 0.85)',
            'glass-bg':         'rgba(255, 255, 255, 0.65)',
            'accent':           '#4A90E2',
            'success':          '#22C55E',
            'warning':          '#F59E0B',
            'error':            '#EF4444',
            /* Surface tokens */
            'dark-surface':     '#F0F8FF',
            'dark-on-surface':  '#172B4D',
            /* Additional palette */
            'ios-blue':         '#4A90E2',
            'ios-blue-accent':  '#64B5F6',
            'ios-cyan':         '#B3E5FC',
            'ios-bg':           '#F0F8FF',
            'ios-bg2':          '#E6F4FF',
            'ios-text':         '#172B4D',
            'ios-text2':        '#64748B',
          },
          borderRadius: {
            'sm':      '6px',
            'DEFAULT': '12px',
            'md':      '14px',
            'lg':      '20px',
            'xl':      '28px',
            'full':    '9999px',
          },
          spacing: {
            'gutter-xs':    '4px',
            'gutter-sm':    '8px',
            'gutter-md':    '16px',
            'gutter-lg':    '24px',
            'gutter-xl':    '32px',
            'section':      '48px',
            'page-margin':  '20px',
          },
          fontFamily: {
            'display':  ['"Alata"', 'sans-serif'],
            'headline': ['"Alata"', 'sans-serif'],
            'title':    ['"Instrument Sans"', 'sans-serif'],
            'body':     ['"Instrument Sans"', 'sans-serif'],
            'label':    ['"Instrument Sans"', 'sans-serif'],
            'code':     ['"Spline Sans Mono"', 'monospace'],
          },
          fontSize: {
            'display-lg':          ['40px', { lineHeight: '48px', letterSpacing: '-0.5px', fontWeight: '700' }],
            'display-lg-mobile':   ['28px', { lineHeight: '36px', letterSpacing: '-0.25px', fontWeight: '700' }],
            'headline-lg':         ['32px', { lineHeight: '40px', letterSpacing: '-0.2px', fontWeight: '700' }],
            'headline-lg-mobile':  ['24px', { lineHeight: '32px', letterSpacing: '-0.1px', fontWeight: '700' }],
            'headline-md':         ['24px', { lineHeight: '32px', fontWeight: '600' }],
            'headline-sm':         ['20px', { lineHeight: '28px', fontWeight: '600' }],
            'title-lg':            ['18px', { lineHeight: '26px', fontWeight: '600' }],
            'title-md':            ['16px', { lineHeight: '24px', fontWeight: '600' }],
            'body-lg':             ['16px', { lineHeight: '24px', fontWeight: '400' }],
            'body-md':             ['14px', { lineHeight: '20px', fontWeight: '400' }],
            'body-sm':             ['12px', { lineHeight: '18px', fontWeight: '400' }],
            'label-lg':            ['14px', { lineHeight: '20px', fontWeight: '600' }],
            'label-md':            ['12px', { lineHeight: '16px', fontWeight: '600' }],
            'label-sm':            ['11px', { lineHeight: '14px', fontWeight: '600' }],
            'code-md':             ['13px', { lineHeight: '18px', fontWeight: '500' }],
          },
          transitionDuration: {
            'state-change':   '150ms',
            'surface-enter':  '250ms',
            'surface-exit':   '150ms',
          },
          transitionTimingFunction: {
            'state-change':  'ease-out',
            'surface-enter': 'cubic-bezier(0.16, 1, 0.3, 1)',
            'surface-exit':  'cubic-bezier(0.4, 0, 1, 1)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Instrument+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] font-body min-h-screen selection:bg-[#2563EB] selection:text-white overflow-x-hidden antialiased">
  <!-- Global Real-Time Emergency Broadcast Banner -->
  <div id="global-alert-host" class="fixed top-0 left-0 right-0 z-[70] pointer-events-none"></div>

  <!-- App Root -->
  <div id="app" class="min-h-screen"></div>

  <!-- Global Modal Host -->
  <div id="modal-host"></div>

  <!-- Global Toast Notification Host -->
  <div id="toast-host" class="fixed bottom-24 right-4 z-[80] flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Supabase JS Client for Realtime Subscriptions -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
